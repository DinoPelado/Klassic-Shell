
name: Build Klassic Shell

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    env:
      CS_VERSION: "4.4.200"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build binaries
        shell: cmd
        run: Src\Setup\BuildBinaries.bat

      - name: Build installers
        shell: cmd
        run: Src\Setup\_BuildEnglish.bat

      - name: Build setup and symbols
        shell: cmd
        run: Src\Setup\BuildArchives.bat

      - name: Upload setup
        uses: actions/upload-artifact@v7
        with:
          name: Klassic-Shell-Installer
          path: Src/Setup/Final/OpenShellSetup*.exe
          if-no-files-found: error
          retention-days: 30
